name: Promote test → main

on:
  workflow_run:
    workflows:
      - "CI - Test Application"
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: test
          title: "Promote test to production"
          body: |
            Automated PR created after successful CI checks on test branch.