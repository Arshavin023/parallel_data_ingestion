name: Deploy Data Pipeline

on:
  push:
    branches:
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: lamisplus
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/lamisplus/lamisplus_ingestion
            git pull personal main
            
            # Inject secrets
            echo "DB_USER=${{ secrets.DB_USER }}" > .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
            echo "DB_NAME_FILEDB=${{ secrets.DB_NAME_FILEDB }}" >> .env
            echo "DB_NAME_LAMISPLUS_STAGING_DWH=${{ secrets.DB_NAME_LAMISPLUS_STAGING_DWH }}" >> .env
            
            # Pre-build the container images so they are ready for the cron job to use
            docker compose down
            docker network prune -f
            /usr/local/bin/docker-compose build --no-cache
            # /usr/local/bin/docker-compose build
