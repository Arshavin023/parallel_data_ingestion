name: Deploy Data Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------
  # BUILD AND PUSH IMAGES
  # ---------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Images
        run: |
          docker compose build

      - name: Push Docker Images
        run: |
          docker compose push

  # ---------------------------------------------------
  # DEPLOY TO SERVER
  # ---------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME_FILEDB: ${{ secrets.DB_NAME_FILEDB }}
          DB_NAME_LAMISPLUS_STAGING_DWH: ${{ secrets.DB_NAME_LAMISPLUS_STAGING_DWH }}
          FILE_DIRECTORY: ${{ secrets.FILE_DIRECTORY }}
          UID: ${{ secrets.UID }}
          GID: ${{ secrets.GID }}

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: lamisplus
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}

          envs: CR_PAT,DB_USER,DB_PASSWORD,DB_PORT,DB_NAME_FILEDB,DB_NAME_LAMISPLUS_STAGING_DWH,FILE_DIRECTORY,UID,GID

          script: |
            set -e

            cd /home/lamisplus/lamisplus_ingestion_v2

            echo "Pulling latest code..."
            git pull personal main

            echo "Generating .env file..."

            cat > .env <<EOF
            DB_USER=$DB_USER
            DB_PASSWORD=$DB_PASSWORD
            DB_PORT=$DB_PORT
            DB_NAME_FILEDB=$DB_NAME_FILEDB
            DB_NAME_LAMISPLUS_STAGING_DWH=$DB_NAME_LAMISPLUS_STAGING_DWH
            FILE_DIRECTORY=$FILE_DIRECTORY
            UID=$UID
            GID=$GID
            EOF

            echo "Authenticating Docker..."
            echo "$CR_PAT" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            echo "Pulling latest containers..."
            docker compose pull

            # echo "Restarting services..."

            # docker compose up -d

            # echo "Cleaning unused layers..."

            # docker image prune -f

            # echo "Deployment complete."