name: Deploy Data Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  # JOB 1: Build the immutable artifact inside GitHub's infrastructure
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Uses the built-in GITHUB_TOKEN instead of requiring a manual CR_PAT secret
      幕- name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx (Enables smart caching)
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Images
        run: |
          # Set the buildx builder as the default for compose
          docker compose build
          docker compose push

  # JOB 2: Ship the changes to the server only after a successful build
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Artifacts and Prepare Environment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: lamisplus
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /home/lamisplus/lamisplus_ingestion

            # Grab updates to the compose file or config tweaks
            git pull personal main

            # Inject the latest environment production variables safely
            cat << EOF > .env
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME_FILEDB=${{ secrets.DB_NAME_FILEDB }}
            DB_NAME_LAMISPLUS_STAGING_DWH=${{ secrets.DB_NAME_LAMISPLUS_STAGING_DWH }}
            FILE_DIRECTORY=${{ secrets.FILE_DIRECTORY }}
            UID=${{ secrets.UID }}
            GID=${{ secrets.GID }}
            EOF

            # Authorize the server daemon to talk to GHCR 
            # Note: The server still needs authentication; using the built-in token here avoids sharing PATs
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            echo "Downloading fresh pre-built image layers..."
            docker compose pull

            echo "Deployment successful! Images are cached and secure for Cron execution."