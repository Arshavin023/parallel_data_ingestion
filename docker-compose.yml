services:
  file-ingestion-service:
    image: ghcr.io/arshavin023/lamisplus_ingestion/file-ingestion-service:latest
    build:
      context: .
      dockerfile: ./records_ingestion/Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${FILE_DIRECTORY}:${FILE_DIRECTORY}
      - ./records_ingestion/logs:/app/logs
    restart: "no"
    command: python /app/records_ingestion/multi_file_ingestion_process.py  # <--- ADD THIS LINE (adjust to your actual script path)

  dsd-ingestion-service:
    image: ghcr.io/arshavin023/lamisplus_ingestion/dsd-ingestion-service:latest
    build:
      context: .
      dockerfile: ./records_ingestion/Dockerfile # Adjust path if DSD uses a different Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${FILE_DIRECTORY}:${FILE_DIRECTORY}
      - ./records_ingestion/logs:/app/logs
    restart: "no"
    command: python /app/records_ingestion/multi_dsd_ingestion_process.py  # <--- ADD THIS LINE (adjust to your actual script path)
  
  records-deletion-service:
    image: ghcr.io/arshavin023/lamisplus_ingestion/records-deletion-service:latest
    build:
      context: .
      dockerfile: ./records_deletion/Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./records_deletion/logs:/app/logs
    restart: "no"

  file-deletion-service:
    image: ghcr.io/arshavin023/lamisplus_ingestion/file-deletion-service:latest
    build:
      context: .
      dockerfile: ./file_deletion/Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${FILE_DIRECTORY}:${FILE_DIRECTORY}
      - ./file_deletion/logs:/app/logs
    restart: "no"